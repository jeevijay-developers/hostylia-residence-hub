project_id = "umznrrdqduynifpatslb"

[functions.razorpay-webhook]
verify_jwt = false

[functions.send-sms-hook]
verify_jwt = false

[auth.hook.send_sms]
enabled = true
uri = "https://umznrrdqduynifpatslb.supabase.co/functions/v1/send-sms-hook"
secrets = "env(SEND_SMS_HOOK_SECRET)"

[auth.sms]
# enable_signup enables the entire Phone provider (login + signup), not only
# new registrations. OTP delivery uses [auth.hook.send_sms] → MSG91 Edge fn.
enable_signup = true
enable_confirmations = true
max_frequency = "1m0s"

# Placeholder Twilio block so GoTrue/CLI mark Phone as enabled. Actual OTP
# delivery is overridden by [auth.hook.send_sms] (MSG91). Do not use real
# Twilio credentials here.
[auth.sms.twilio]
enabled = true
account_sid = "AC00000000000000000000000000000000"
message_service_sid = "MG00000000000000000000000000000000"
auth_token = "placeholder_not_used_when_sms_hook_enabled"

# Everything below restores the project's pre-existing values, which an
# unscoped `supabase config push` would otherwise silently reset to the
# CLI's local-dev template defaults.
[auth]
# Canonical origin. Apex already 308s to www — do not point site_url at the apex.
# Auth email {{ .SiteURL }} / {{ .ConfirmationURL }} are built from this.
# Apex, www, the Vercel host, and local dev stay allowed as redirect targets.
site_url = "https://www.hostylia.com"
additional_redirect_urls = ["https://hostylia-residence-hub.vercel.app/**", "https://hostylia.com/**", "https://www.hostylia.com/**", "http://localhost:8080/**"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

# Reset Password ("Forgot Password") email — branded to match the Staff
# Invitation email's design system. GoTrue reuses this same slot for
# resetPasswordForEmail regardless of email address, no code path change.
[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

# GoTrue's native invite slot (supabase.auth.admin.inviteUserByEmail) — not
# currently called by any code path here (staff invites go through the
# app's own Resend-based send-notification "staff_invite" template instead),
# but styled to match in case it's ever used.
[auth.email.template.invite]
subject = "You've been invited"
content_path = "./supabase/templates/invite.html"

# Confirm signup — triggered live by supabase.auth.signUp()
# (src/components/auth/SignupForm.tsx).
[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

# Change email address — not currently called by any code path here (every
# profile-edit form keeps email staff-only or read-only), styled to match
# in case an email-change flow is ever added.
[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/email_change.html"

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(TURNSTILE_SECRET_KEY)"
